name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: dist matches the source
        run: |
          bun run build
          git diff --exit-code -- dist || (echo "::error::dist/ is out of date: run 'bun run build' and commit it" && exit 1)
      - name: package version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "${GITHUB_REF_NAME}"

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: bun run e2e
        env:
          CHRONOS_BROWSER: ${{ matrix.browser }}
