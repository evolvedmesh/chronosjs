name: Release

# Every push to main (and dev, as -dev prereleases): semantic-release reads the Conventional Commits since the last
# tag. When they call for a release it stamps package.json, builds and packs chronosjs-X.Y.Z.tgz
# (scripts/pack.ts), commits package.json as `ci(release): X.Y.Z [skip ci]`, tags vX.Y.Z and attaches the tarball
# to the GitHub release. Apps install that tarball; dist/ is never committed.

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Mint an installation token for the evolvedmesh-release-bot GitHub App.
      # @semantic-release/git pushes the `ci(release):` commit back to the
      # protected branch, and only this App is a bypass actor on the main/dev
      # rulesets; the default GITHUB_TOKEN is not, so the push runs as the App.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # scripts/pack.ts (the prepare step) builds and packs with Bun.
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Run Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
