name: CI

# Checks every pull request (make `check` and the `e2e` jobs required status checks on the main/dev rulesets, so a
# branch can't merge while they are red) and every push. Releases are release.yml.

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - run: mkdir -p e2e-shots
      - run: bun run e2e
        env:
          CHRONOS_BROWSER: ${{ matrix.browser }}
          CHRONOS_SHOTS: ${{ github.workspace }}/e2e-shots
      # The live, replayed and diff images of the visual comparison, to see why it failed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-${{ matrix.browser }}
          path: e2e-shots
          retention-days: 7
